# 站点通知信息
notice: 这里是我的个人知识库：读到哪、想到哪、写到哪。条目优先按「领域」组织，时间线只用来记录最近的输入。

# 作者信息
author:
  name: Seven
  avatar: https://s3.bmp.ovh/imgs/2022/08/16/7664c2614b5ecd75.jpeg
  description: 知识在于总结，贵在坚持

toc:
  max_depth: 3 # 生成 TOC 的最大深度
  min_depth: 2 # 生成 TOC 的最小深度

comments:
  enable: true
  use: 'giscus' # giscus || valine || disqus
  # giscus 评论：数据存在 GitHub Discussions，免费、无后端、不用备案
  # 三步：1) 建一个 public 仓库，Settings → General 里勾上 Discussions
  #       2) 给仓库装 giscus App: https://github.com/apps/giscus
  #       3) 打开 https://giscus.app 选仓库和讨论分类，把下面 4 个值抄过来
  # 没填 repoId / categoryId 时不会渲染评论区（不会留空白框）
  giscus:
    repo: 'SevenYang9527/MyBlog'
    repoId: 'R_kgDOVXFJOA'
    category: 'Announcements'
    categoryId: 'DIC_kwDOVXFJOM4DJmWT'
    mapping: pathname # pathname | url | title | og:title
    reactionsEnabled: '1'
    inputPosition: top
    themeLight: light
    themeDark: dark
    lang: zh-CN
  # valine 评论（旧方案：那对 LeanCloud key 所属应用已被归档，保留配置但不再使用）
  # docs: https://valine.js.org
  # You can get your appid and appkey from https://leancloud.cn
  # 这里appId和appKey一定一定要改成自己的，没有的话去https://leancloud.cn这个网站注册创建一个
  valine:
    appId: ajzj3eMz54eWdU1uvSi3c9fm-gzGzoHsz
    appKey: CrFQTvpKMQ8wgrPArS4k4j9N
    avatar: Seven
    placeholder: 随便说点什么叭～
    notify: true
    visitor: true
    pageSize: 10
  # disqus 评论
  # docs: https://disqus.com/
  disqus:
    website: 
    error: 如果你看不到评论，那么就真的看不到评论 w(゜Д゜)w

# dplayer 视频播放
# docs: http://dplayer.js.org/#/zh-Hans/
dplayer:
  enable: true
  theme: "#b7daff"
  autoplay: false
  loop: false
  mutex: true

# aplayer 音频播放
# docs: https://aplayer.js.org/#/zh-Hans/
aplayer:
  enable: true
  theme: "#b7daff"
  autoplay: false
  loop: false
  mutex: true
  lrcType: 3
  
