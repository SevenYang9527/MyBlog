# —— 书籍系列（Unity 官方电子书全译 + 技术讲义考据；books/ 下按章构建）——

- tag: 书籍系列 · 架构
  title: 《用 ScriptableObjects 构建模块化游戏架构》
  intro: Unity 官方电子书全译：把数据与逻辑拆开，用 ScriptableObject 做数据容器，再讲透可扩展枚举、委托对象、观察者、命令、运行时集合五个模式。
  stats:
    - 9 章
    - 原书 76 页
    - 全译 + 代码
  url: /books/modular-so/

- tag: 书籍系列 · 渲染
  title: 《URP 进阶指南》
  intro: Unity 官方电子书全译：从内置管线迁移到 URP，逐项讲光照、贴花、Shader、管线回调、后处理、相机堆叠与性能。
  stats:
    - 12 章
    - 原书 140 页
    - 全译 + 代码
  url: /books/urp/

- tag: 书籍系列 · 架构
  title: 《用游戏编程模式升级你的代码》
  intro: Unity 官方电子书全译：先讲透 SOLID，再逐个拆解工厂、对象池、单例、命令、状态、观察者、MVP 七个模式在 Unity 里的落地写法。
  stats:
    - 10 章
    - 原书 99 页
    - 全译 + 代码
  url: /books/gpp/

- tag: 书籍系列 · 性能
  title: 《Unity 游戏性能分析终极指南》
  intro: Unity 官方电子书全译：把「卡」拆成可追的线索——帧预算、CPU/GPU 定位、内存分析，以及一整章 Unity 自带分析工具的使用手册。
  stats:
    - 5 章
    - 原书 75 页
    - 全译 + 代码
  url: /books/profiling/

- tag: 书籍系列 · 性能
  title: 《Unity 移动游戏性能优化指南》
  intro: Unity 官方电子书全译：从分析、内存、代码架构，一路到资源、GPU、UI、音频、动画、物理的逐项优化清单。
  stats:
    - 13 章
    - 原书 80 页
    - 全译 + 代码
  url: /books/mobile-perf/

- tag: 技术讲义 · UI
  title: 《UGUI 原理与优化：逐条考据版》
  intro: 以一份 2018-2019 年的 34 页 UGUI 讲义为底本，对照 Unity 官方文档与 uGUI 源码逐条校验：保留仍然有效的经验，标出过时与错误，并补上 2026 年仍适用的做法。
  stats:
    - 15 章
    - 原讲义 34 页
    - 逐条考据 + 代码
  url: /books/ugui-notes/

- tag: 书籍导读 · Shader
  title: 《Unity Shader 入门精要》精要导读
  intro: 以冯乐乐原书的 20 章结构为线索，用原创表述重讲渲染流水线、ShaderLab、光照、纹理、透明、后处理、PBR 与优化，并标注内置管线到 URP 的迁移差异。
  stats:
    - 21 章
    - 原书 389 页
    - 原创导读 + 代码
  url: /books/shader-notes/

- tag: 课程导读 · 计算机科学
  title: 《计算机科学速成课》全 40 集精读
  intro: 按 Crash Course Computer Science 的 40 集顺序逐集重讲，覆盖历史、硬件、软件、数据、网络、安全与 AI；配原创 SVG 图解与 2026 年补充。
  stats:
    - 40 章
    - 原课程 40 集
    - 原创导读 + 图解
  url: /books/cs-crash-course/
